[hosting]
public_base_url = "https://packages.toxdes.com"
release_prefix = "glesha/releases"
apt_prefix = "apt"
rpm_prefix = "rpm"

[hosting.apt]
suite = "stable"
component = "main"
origin = "toxdes"
label = "Toxdes"

[hosting.aur]
host = "aur.archlinux.org"
ssh_user = "aur"
maintainer = "toxdes <hi@toxdes.com>"

[aur]
binary_package = "glesha-bin"
git_package = "glesha-git"
git_pkgbuild = "PKGBUILD"
srcinfo_helper_image = "docker.io/toxdes/yesb-aur-helper@sha256:e0b511b58baf4d1e281b154a50fd15125f886472dc7166a4aa578cb7a40435ea"

[homebrew]
tap = "toxdes/tap"
remote = "git@github.com:toxdes/homebrew-tap.git"
branch = "main"
formula = "glesha"
binary = "bin/glesha"

[[homebrew.assets]]
source = "share/man/man1/glesha-archive.1"
destination = "man1"

[[homebrew.assets]]
source = "share/man/man1/glesha-browse.1"
